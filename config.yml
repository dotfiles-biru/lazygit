# ~/.config/lazygit/config.yml

gui:
  # UI
  filterMode: fuzzy
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#80c8e0"
      - "bold"
    inactiveBorderColor:
      - "#586478"
    searchingActiveBorderColor:
      - "#d4b878"
      - "bold"
    optionsTextColor:
      - "#80c8e0"
    selectedLineBgColor:
      - "#283448"
    inactiveViewSelectedLineBgColor:
      - "#1e2430"
    cherryPickedCommitFgColor:
      - "#80c8e0"
    cherryPickedCommitBgColor:
      - "#b0a0d8"
    markedBaseCommitFgColor:
      - "#80c8e0"
    markedBaseCommitBgColor:
      - "#d4b878"
    unstagedChangesColor:
      - "#c46c78"
    defaultFgColor:
      - "#c8d0e0"

git:
  # Safer workflow
  disableForcePushing: true

  log:
    order: topo-order
    showGraph: always

os:
  # Neovim
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
